<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NoTrack - Controle Financeiro{% endblock %}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block head %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="../static/img/logo.png" alt="Logo NoTrack">
            </div>
            
            <nav>
                <ul>
                    <li>
                        <a href="{{ url_for('dashboard.dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('lancamentos') }}" class="{% if request.endpoint == 'lancamentos' %}active{% endif %}">
                            <i class="fas fa-exchange-alt"></i>
                            <span>Lançamentos</span>
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('novo_lancamento') }}" class="{% if request.endpoint == 'novo_lancamento' %}active{% endif %}">
                            <i class="fas fa-plus-circle"></i>
                            <span>Novo Lançamento</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="user-area">
                <div class="user-info">
                    <span class="user-name">{{ session.get('usuario_nome', 'Usuário') }}</span>
                </div>
                
                <button class="logout-btn" onclick="window.location.href='{{ url_for('auth.logout') }}'">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sair</span>
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <main>            
            {% block conteudo %}{% endblock %}
        </main>
    </div>

    <footer>
        <div class="footer-container">
            <div class="logo">
                <img src="../static/img/logo.png" alt="Logo NoTrack">
            </div>
            
            <!-- <div class="footer-links">
                <a href="#">Sobre</a>
                <a href="#">Ajuda</a>
                <a href="#">Contato</a>
                <a href="#">Privacidade</a>
            </div> -->
            
            <div class="copyright">
                &copy; 2026 NoTrack • Finanças Simplificadas
            </div>
        </div>
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>
