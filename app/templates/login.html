<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../static/img/logo.png" type="image/x-icon">
    <title>Login | NoTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/reset.css"> 
    <link rel="stylesheet" href="../static/css/login.css"> 
</head>
<body>
    <div class="login-card">
        <!-- Lado esquerdo - Apenas a logo -->
        <div class="login-left">
            <div class="logo">
                <img src="../static/img/logoEscrita.png" alt="Logo NoTrack">
            </div>
        </div>

        <!-- Lado direito - Formulário completo -->
        <div class="login-right">
            <div class="dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <div class="login-header">
                <h2>Bem-vindo</h2>
                <p>Faça login na sua conta</p>
            </div>

            <div class="form-container">
                {% if erro %}
                <div class="alert">
                    <i class="fas fa-exclamation-circle"></i>
                    {{ erro }}
                </div>
                {% endif %}
                
                <form method="post">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="Seu e-mail" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="senha" placeholder="Sua senha" required>
                    </div>
                    
                    <button type="submit" class="btn-login">
                        <i class="fas fa-arrow-right"></i>
                        Entrar
                    </button>
                </form>
                
                <div class="register-link">
                    Novo por aqui? <a href="{{ url_for('auth.register') }}">Crie sua conta</a>
                </div>
                
                <div class="footer">
                    NoTrack • Finanças Simplificadas
                </div>
            </div>
        </div>
    </div>
</body>
</html>
